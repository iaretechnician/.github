name: "🐞 Bug report"
description: "Something isn’t working as expected."
title: "[bug] <short summary>"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please provide clear repro steps and impact.


  - type: dropdown
    id: components
    attributes:
      label: Affected component(s)
      description: "Select all that apply"
      multiple: true
      options:
        - Core App / Client
        - Backend / API
        - Game Servers
        - Infrastructure / DevOps
        - Docs / Website
        - Billing / Payments
        - Customer Portal
        - Other
    validations:
      required: true


  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What you thought would happen"
    validations:
      required: true


  - type: input
    id: version
    attributes:
      label: Version / Build / Commit
      placeholder: "e.g., v1.2.3, build #456, or commit SHA"

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      placeholder: "OS, browser, region, server, config flags, etc."

  - type: dropdown
    id: severity
    attributes:
      label: Severity / Impact
      options:
        - S0 - Critical (no workaround)
        - S1 - High (major function broken)
        - S2 - Medium (workaround exists)
        - S3 - Low (minor/edge)
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Evidence
      description: "Paste logs, screenshots, or links to failing runs"

  - type: textarea
    id: notes
    attributes:
      label: Additional context / suspected cause

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and discussions
          required: true
        - label: I can reproduce this reliably
          required: false
