name: "📝 Documentation"
description: "Request docs or improvements to existing docs."
title: "[docs] <short summary>"
labels:
  - documentation
  - needs triage
body:
  - type: dropdown
    id: doctypes
    attributes:
      label: Doc type
      options:
        - Guide / How-to
        - Reference
        - Tutorial / Onboarding
        - FAQ
        - Changelog / Release notes
    validations:
      required: true

  - type: input
    id: audience
    attributes:
      label: Audience
      placeholder: "Players, Admins, Devs, Ops, New hires, etc."

  - type: input
    id: location
    attributes:
      label: Where should this live?
      placeholder: "Repo path, wiki, docs site URL, knowledge base section"

  - type: textarea
    id: outline
    attributes:
      label: Proposed outline / headings
      description: "Bullets are fine"

  - type: textarea
    id: sources
    attributes:
      label: Sources / references
      placeholder: "Links to specs, code, prior docs"

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      placeholder: |
        - Reviewed by SME
        - Screenshots updated
        - Examples tested
