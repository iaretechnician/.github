name: "🚀 Enhancement"
description: "Improve an existing feature or workflow."
title: "[enhancement] <short summary>"
labels:
  - enhancement

body:  
  - type: textarea
    id: current
    attributes:
      label: Current behavior / pain
      placeholder: "What’s clunky, slow, or confusing now?"

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      placeholder: "Describe the improvement"

  - type: dropdown
    id: components
    attributes:
      label: Affected component(s)
      multiple: true
      options:
        - Core App / Client
        - Backend / API
        - Game Servers
        - Infrastructure / DevOps
        - Docs / Website
        - Billing / Payments
        - Customer Portal
        - Other

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1 - High
        - P2 - Medium
        - P3 - Low

  - type: textarea
    id: success
    attributes:
      label: Success criteria / metrics
      placeholder: "What measurable improvement do we expect?"

  - type: textarea
    id: context
    attributes:
      label: Additional context
