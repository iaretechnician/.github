name: "✨ New feature"
description: "Propose a new capability or major addition."
title: "[feature] <short summary>"
labels:
  - feature
 
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement / user story
      placeholder: "As a ..., I want ... so that ... "
    validations:
      required: true

 

  - type: dropdown
    id: components
    attributes:
      label: Target component(s)
      multiple: true
      options:
        - Core App / Client
        - Backend / API
        - Game Servers
        - Infrastructure / DevOps
        - Docs / Website
        - Billing / Payments
        - Customer Portal
        - Other

  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      placeholder: "Explicitly not included in this feature"

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / related work
      placeholder: "Links to issues, PRs, design docs"

  - type: textarea
    id: rollout
    attributes:
      label: Rollout / risk / metrics
      placeholder: "Launch plan, flags, dashboards, SLAs"

  - type: textarea
    id: notes
    attributes:
      label: Additional context
