name: "🛑 BROKEN / Outage"
description: "Something is down or severely degraded."
title: "[BROKEN] <short summary>"
labels:
  - broken
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Use this for outages or critical breakages affecting users or operations.

  - type: input
    id: summary
    attributes:
      label: One-liner
      placeholder: "e.g., NA game servers unreachable, API 500s, payments failing"
    validations:
      required: true

  - type: dropdown
    id: blast
    attributes:
      label: Blast radius
      options:
        - All users / regions
        - Many users / multiple regions
        - Some users / single region
        - Single tenant / account
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms / alerts
      placeholder: "What are we seeing (error codes, dashboards, alerts)?"
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Start time & timeline
      placeholder: "When did this begin? List key times."

  - type: textarea
    id: suspected
    attributes:
      label: Suspected cause
      placeholder: "If known; otherwise leave blank"

  - type: textarea
    id: mitigations
    attributes:
      label: Mitigations attempted
      placeholder: "Rollbacks, feature flags, restarts, traffic shifts, etc."

  - type: textarea
    id: impact
    attributes:
      label: Impact
      placeholder: "User impact, revenue risk, SLA/SLO impact"

  - type: checkboxes
    id: paging
    attributes:
      label: Paging & comms
      options:
        - label: On-call / incident channel notified
        - label: Status page updated (if applicable)
        - label: Customer comms prepared
