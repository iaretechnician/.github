name: "✨ New feature"
description: "Propose a new capability or major addition."
title: "[feature] <short summary>"
labels:
  - feature
  - needs triage
body:
  - type: input
    id: summary
    attributes:
      label: One-liner
      placeholder: "What should exist?"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement / user story
      placeholder: "As a <role>, I want <capability> so that <outcome>."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Bullet list of verifiable outcomes"
      placeholder: |
        - When I ..., I see ...
        - API returns ...
    validations:
      required: true

  - type: dropdown
    id: components
    attributes:
      label: Target component(s)
      multiple: true
      options:
        - Core App / Client
        - Backend / API
        - Game Servers
        - Infrastructure / DevOps
        - Docs / Website
        - Billing / Payments
        - Customer Portal
        - Other

  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      placeholder: "Explicitly not included in this feature"

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / related work
      placeholder: "Links to issues, PRs, design docs"

  - type: textarea
    id: rollout
    attributes:
      label: Rollout / risk / metrics
      placeholder: "Launch plan, flags, dashboards, SLAs"

  - type: textarea
    id: notes
    attributes:
      label: Additional context
